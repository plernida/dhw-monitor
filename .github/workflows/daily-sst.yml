# refresh 2026-02-25
name: Daily DHW Update
on:
  schedule:
    - cron: '0 0 * * *'  # Midnight UTC (~7AM BKK)
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - uses: actions/setup-python@v5
      with: {python-version: '3.11'}
    - run: pip install -r requirements.txt
    - run: python daily_dhw.py
    - uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: 'Daily DHW/SST PNGs'
        file_pattern: static/lastest_*.png

