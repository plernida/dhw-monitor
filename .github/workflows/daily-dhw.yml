name: Daily DHW PNGs
on:
  schedule:
    - cron: '0 3 * * *'  # 7AM BKK daily
  workflow_dispatch:  # Manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -r requirements.txt
    - name: Clean static (force fresh files)
      run: |
        rm -f static/*.nc static/*.json static/*.png
        mkdir -p static
    - run: python daily_dhw.py
    
    - uses: actions/upload-artifact@v4
      with:
        name: dhw-files-${{ github.run_id }}
        path: static/
    
    - uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: 'Daily DHW/SST files {{date}}'
        file_pattern: static/**
