name: Daily DHW PNGs
on:
  schedule:
    - cron: '0 0 * * *'  # 7AM BKK daily
  workflow_dispatch:  # Manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For git-auto-commit
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -r requirements.txt
    - run: python daily_dhw.py
    - uses: actions/upload-artifact@v4
    if: always()
    with:
      name: dhw-files-${{ github.run_id }}
      path: static/
    
    # UPDATED: Commit ALL generated files
    - uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: 'Daily DHW/SST PNGs {{date}}'
        file_pattern: static/*

