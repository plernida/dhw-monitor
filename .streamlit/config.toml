[theme]
font = "Kanit"
headingFont = "Kanit"
codeFont = "monospace"

# Enable static file serving
[server]
enableStaticServing = true

# Custom font faces
[[theme.fontFaces]]
family = "Kanit"
url = "/static/kanit.ttf"  # ไฟล์ใน static folder
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "Kanit"
url = "/static/kanitb.ttf"  # Bold version
weight = 700
style = "normal"
